name: GUI CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'gui/**'
      - '.github/workflows/gui-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gui/**'

jobs:
  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run Ruff (linting)
        run: ruff check .

      - name: Run Black (formatting check)
        run: black --check .

      - name: Run MyPy (type checking)
        run: mypy . --ignore-missing-imports

      - name: Run Tests
        run: pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: backend

  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier (format check)
        run: npm run format:check

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run Tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: gui
          file: gui/Dockerfile.backend.dev
          push: false
          tags: condorbrain-gui-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: gui
          file: gui/Dockerfile.frontend.dev
          push: false
          tags: condorbrain-gui-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
