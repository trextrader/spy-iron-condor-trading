repos:
  # Python hooks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.14
    hooks:
      - id: ruff
        args: [--fix]
        files: ^gui/backend/

  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        files: ^gui/backend/

  # JavaScript/TypeScript hooks
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd gui/frontend && npm run lint'
        language: system
        files: ^gui/frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: prettier
        name: prettier
        entry: bash -c 'cd gui/frontend && npm run format:check'
        language: system
        files: ^gui/frontend/.*\.(ts|tsx|css|json)$
        pass_filenames: false

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
